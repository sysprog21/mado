name: Headless Backend Tests

on: [push, pull_request]

jobs:
  headless-test:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y valgrind imagemagick python3

    - name: Configure build
      run: |
        make defconfig
        python3 tools/kconfig/setconfig.py --kconfig configs/Kconfig \
          BACKEND_HEADLESS=y \
          TOOLS=y \
          TOOL_HEADLESS_CTL=y \
          DEMO_MULTI=y

    - name: Build with headless backend
      run: |
        make -j$(nproc)

    - name: Verify build outputs
      run: |
        test -x ./demo-headless || (echo "demo-headless not built" && exit 1)
        test -x ./headless-ctl || (echo "headless-ctl not built" && exit 1)
        echo "Build outputs verified successfully"

    - name: Run headless test suites
      run: |
        make check

    - name: Run basic headless test
      run: |
        # Start demo in background, capture stderr for memory stats
        export MADO_SCENE=desktop
        timeout 30s ./demo-headless 2>demo_stderr.log &
        DEMO_PID=$!
        echo "Started demo-headless with PID $DEMO_PID"

        # Wait for backend to initialize
        sleep 3

        # Test control tool commands
        ./headless-ctl status
        ./headless-ctl shot test_output.png

        # Inject mouse events
        ./headless-ctl mouse move 100 100
        ./headless-ctl mouse down 100 100 1
        ./headless-ctl mouse up 100 100 1

        # Check status again after events
        ./headless-ctl status

        # Shutdown gracefully
        ./headless-ctl shutdown || true

        # Wait for process to exit
        wait $DEMO_PID || true
        echo "Basic test completed"

    - name: Report memory statistics
      if: always()
      run: |
        echo "=== Mado Memory Statistics ==="
        grep -i "memory" demo_stderr.log 2>/dev/null || echo "(no memory stats in output)"
        cat demo_stderr.log 2>/dev/null || true

    - name: Verify screenshot output
      run: |
        test -f test_output.png || (echo "Screenshot not created" && exit 1)
        file test_output.png | grep -q PNG || (echo "Screenshot is not a valid PNG" && exit 1)
        echo "Screenshot verification passed"

    - name: Test deterministic rendering
      run: |
        export MADO_SCENE=desktop
        # Run twice and compare outputs for determinism
        echo "First run..."
        timeout 10s ./demo-headless &
        PID1=$!
        sleep 3
        ./headless-ctl shot run1.png
        ./headless-ctl shutdown
        wait $PID1 || true

        echo "Second run..."
        timeout 10s ./demo-headless &
        PID2=$!
        sleep 3
        ./headless-ctl shot run2.png
        ./headless-ctl shutdown
        wait $PID2 || true

        # Verify PNGs are valid before comparing
        for f in run1.png run2.png; do
          if ! identify "$f" > /dev/null 2>&1; then
            echo "ERROR: $f is not a valid PNG"
            exit 1
          fi
        done

        # Compare images (allowing minor differences)
        # compare writes the metric to stderr, stdout gets the diff image
        DIFF=$(compare -metric AE run1.png run2.png null: 2>&1) || true
        # Extract just the numeric value (AE metric is an integer)
        DIFF=$(echo "$DIFF" | grep -oE '^[0-9]+' | head -1)
        if [ -z "$DIFF" ]; then
          echo "ERROR: Failed to get pixel difference from compare"
          exit 1
        fi
        echo "Pixel difference: $DIFF"

        if [ "$DIFF" -gt "100" ]; then
          echo "ERROR: Renderings differ by more than 100 pixels"
          exit 1
        fi
        echo "Deterministic rendering test passed"

    - name: Memory leak detection with Valgrind
      run: |
        export MADO_SCENE=desktop DEBUGINFOD_URLS=
        # Run with Valgrind for leak detection
        timeout 15s valgrind \
          --leak-check=full \
          --show-leak-kinds=definite,possible \
          --errors-for-leak-kinds=definite \
          --error-exitcode=1 \
          --log-file=valgrind.log \
          ./demo-headless 2>valgrind_demo_stderr.log &
        VALGRIND_PID=$!

        sleep 5

        # Perform some operations
        ./headless-ctl mouse move 50 50 || true
        ./headless-ctl shot valgrind_screenshot.png || true
        ./headless-ctl shutdown || true

        # Wait for Valgrind to finish
        wait $VALGRIND_PID || VALGRIND_EXIT=$?

        # Display Valgrind summary
        echo "=== Valgrind Summary ==="
        grep -A 10 "LEAK SUMMARY" valgrind.log || true
        grep "ERROR SUMMARY" valgrind.log || true

        # Display memory statistics from twin_destroy
        echo "=== Mado Memory Statistics (Valgrind run) ==="
        grep -i "memory" valgrind_demo_stderr.log 2>/dev/null || true

        # Check for definite leaks
        if grep -q "definitely lost: [1-9]" valgrind.log; then
          echo "ERROR: Memory leaks detected"
          cat valgrind.log
          exit 1
        fi
        echo "No definite memory leaks detected"

    - name: Rebuild with the mobile window manager
      run: |
        python3 tools/kconfig/setconfig.py --kconfig configs/Kconfig WM_MOBILE=y
        python3 tools/kconfig/genconfig.py configs/Kconfig
        make -j$(nproc)
        make check

    - name: Phone end-to-end
      run: |
        # Boot the phone shell, unlock, open Calculator, type, screenshot
        MADO_SCENE=mobile timeout 30s ./demo-headless 2>phone_stderr.log &
        PID=$!
        sleep 2
        ./headless-ctl shot phone_lock.png
        # Slide to unlock: drag the knob along the track
        ./headless-ctl mouse down 33 295 1
        for x in 60 100 140 180 220 230; do
          ./headless-ctl mouse move $x 295 1
          sleep 0.05
        done
        ./headless-ctl mouse up 230 295 1
        sleep 1
        ./headless-ctl shot phone_home.png
        # Calculator icon (second row, first column)
        ./headless-ctl mouse down 40 128 1
        ./headless-ctl mouse up 40 128 1
        sleep 1
        ./headless-ctl type "12+30="
        sleep 1
        ./headless-ctl shot phone_calc.png
        ./headless-ctl shutdown || true
        wait $PID || true
        for f in phone_lock.png phone_home.png phone_calc.png; do
          identify "$f" > /dev/null || (echo "$f invalid" && exit 1)
        done
        # The three screens must differ
        for a in "phone_lock.png phone_home.png" "phone_home.png phone_calc.png"; do
          set -- $a
          DIFF=$(compare -metric AE $1 $2 null: 2>&1 | grep -oE '^[0-9]+' | head -1)
          echo "$1 vs $2: $DIFF pixels differ"
          [ "${DIFF:-0}" -gt 1000 ] || (echo "navigation did not change the screen" && exit 1)
        done

    - name: Upload phone screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: phone-screenshots
        path: phone_*.png
